<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Sports</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #182326 0, #0c1013 65%);
      color: #edf2f3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 100px 24px; }
    h1 { margin: 0 0 40px; font-size: clamp(40px, 8vw, 64px); letter-spacing: -.05em; }
    nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    a {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px;
      min-height: 132px; padding: 28px;
      color: inherit; text-decoration: none;
      background: #151c21; border: 1px solid #2a343b; border-radius: 16px;
      transition: background .18s, border-color .18s, transform .18s;
    }
    a:hover { background: #1c292c; border-color: #87c9ad; transform: translateY(-3px); }
    a:focus-visible { outline: 3px solid #87c9ad; outline-offset: 4px; }
    .sport-image { grid-column: 1 / -1; width: 100%; height: 150px; padding: 10px; background: #10171b; border-radius: 10px; object-fit: contain; }
    .name { display: block; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
    .arrow { color: #87c9ad; font-size: 25px; }
    @media (max-width: 560px) {
      main { padding-top: 56px; }
      nav { grid-template-columns: 1fr; }
      a { min-height: 110px; padding: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Sports</h1>
    <nav aria-label="Sports">
      <a href="https://chriscremer.ca/cycling/">
        <img class="sport-image" src="assets/cycling.svg" alt="" width="200" height="170">
        <span class="name">Cycling</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="soccer/index.html">
        <img class="sport-image" src="assets/soccer.svg" alt="" width="200" height="170">
        <span class="name">Soccer</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="pickleball/">
        <img class="sport-image" src="assets/pickleball.svg" alt="" width="200" height="170">
        <span class="name">Pickleball</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="https://chriscremer.ca/TPL/index.html">
        <img class="sport-image" src="assets/frisbee.svg" alt="" width="200" height="170">
        <span class="name">Frisbee</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="https://golftracker123.github.io/">
        <img class="sport-image" src="assets/golf.svg" alt="" width="200" height="170">
        <span class="name">Golf</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
