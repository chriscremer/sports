<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Pickleball</title>
  <link rel="icon" type="image/svg+xml" href="../assets/pickleball.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #182326 0, #0c1013 65%);
      color: #edf2f3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 860px; margin: auto; padding: 64px 24px 100px; }
    .back { display: inline-block; color: #87c9ad; text-decoration: none; margin-bottom: 36px; }
    .back:hover { text-decoration: underline; }
    h1 { margin: 0 0 36px; font-size: clamp(40px, 8vw, 64px); letter-spacing: -.05em; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
    .card {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px;
      min-height: 150px; padding: 28px;
      color: inherit; text-decoration: none;
      background: #151c21; border: 1px solid #2a343b; border-radius: 16px;
      transition: background .18s, border-color .18s, transform .18s;
    }
    .card:hover { background: #1c292c; border-color: #87c9ad; transform: translateY(-3px); }
    a:focus-visible { outline: 3px solid #87c9ad; outline-offset: 4px; }
    .name { display: block; font-size: 23px; font-weight: 600; letter-spacing: -.02em; }
    .description { display: block; color: #a3b4aa; margin-top: 10px; line-height: 1.5; }
    .arrow { color: #87c9ad; font-size: 28px; }
    @media (max-width: 560px) { main { padding-top: 32px; } .card { padding: 24px; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../index.html">← Sports</a>
    <h1>Pickleball</h1>
    <nav aria-label="Pickleball pages">
      <a class="card" href="pickleball_standings.html#elo">
        <span><span class="name">Standings &amp; Elo</span><span class="description">League standings, ratings, schedules and results.</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="card" href="pickleball_analysis/index.html">
        <span><span class="name">Video Analysis</span><span class="description">Source footage, player tracking and 3D rally reconstruction.</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
